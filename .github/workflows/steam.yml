name: Build Steam AppImage

on:
  workflow_dispatch:
  push:
    paths:
      - 'opensuse-appimage.sh'
      - '.github/workflows/steam.yml'
  schedule:
    - cron: '0 6 * * 0'  # Weekly rebuild

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap curl squashfs-tools xz-utils

      - name: Cache openSUSE rootfs
        uses: actions/cache@v4
        id: cache
        with:
          path: ~/.local/share/steam-appimage-opensuse/rootfs
          key: steam-opensuse-tw-${{ runner.os }}-${{ hashFiles('opensuse-appimage.sh') }}
          restore-keys: |
            steam-opensuse-tw-${{ runner.os }}-

      - name: Setup Steam
        run: |
          chmod +x opensuse-appimage.sh
          ./opensuse-appimage.sh setup

      - name: Build AppImage
        run: |
          OUTPUT="Steam-opensuse-TW-x86_64.AppImage"
          ./opensuse-appimage.sh build "$OUTPUT"
          echo "output=$OUTPUT" >> "$GITHUB_OUTPUT"
        id: build

      - name: Verify
        run: |
          file "${{ steps.build.outputs.output }}"
          ls -lh "${{ steps.build.outputs.output }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Steam-opensuse-AppImage
          path: ${{ steps.build.outputs.output }}
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.output }}
          generate_release_notes: true
