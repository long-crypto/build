name: Build Steam AppImage (openSUSE Tumbleweed)
description: Build a portable Steam AppImage from openSUSE Tumbleweed
author: steam-appimage-opensuse

branding:
  icon: play
  color: green

inputs:
  output:
    description: 'Output filename'
    required: false
    default: 'Steam-opensuse-TW-x86_64.AppImage'

outputs:
  appimage:
    description: 'Path to the generated AppImage'
    value: ${{ steps.build.outputs.appimage }}

runs:
  using: composite
  steps:
    - name: Install host dependencies
      shell: bash
      run: |
        if command -v apt-get &>/dev/null; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap curl squashfs-tools xz-utils zstd
        elif command -v dnf &>/dev/null; then
          sudo dnf install -y bubblewrap curl squashfs-tools xz
        elif command -v pacman &>/dev/null; then
          sudo pacman -S --noconfirm bubblewrap curl squashfs-tools xz
        elif command -v zypper &>/dev/null; then
          sudo zypper --non-interactive install bubblewrap curl squashfs xz
        fi

    - name: Cache openSUSE rootfs
      uses: actions/cache@v4
      with:
        path: ~/.local/share/steam-appimage-opensuse/rootfs
        key: steam-opensuse-tw-${{ runner.os }}-${{ hashFiles(format('{0}/opensuse-appimage.sh', github.action_path)) }}
        restore-keys: |
          steam-opensuse-tw-${{ runner.os }}-

    - name: Setup Steam
      shell: bash
      run: |
        SCRIPT="${{ github.action_path }}/opensuse-appimage.sh"
        chmod +x "$SCRIPT"
        "$SCRIPT" setup

    - name: Build AppImage
      id: build
      shell: bash
      run: |
        SCRIPT="${{ github.action_path }}/opensuse-appimage.sh"
        OUTPUT="${{ inputs.output }}"
        "$SCRIPT" build "$OUTPUT"
        echo "appimage=$(realpath "$OUTPUT")" >> "$GITHUB_OUTPUT"
        echo "=== Built ==="
        file "$OUTPUT"
        ls -lh "$OUTPUT"
